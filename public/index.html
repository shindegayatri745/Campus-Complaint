<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Campus Complaint System</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Cpath%20fill='%2314514A'%20d='M12%202l8%203.5v6.2C20%2017%2016.6%2021%2012%2022.5%207.4%2021%204%2017%204%2011.7V5.5L12%202z'/%3E%3Cpath%20fill='none'%20stroke='%23fff'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'%20d='M8.5%2012l2.5%202.5%204.5-5'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="auth-layout">

  <!-- brand panel (hidden below 900px) -->
  <aside class="brand-panel">
    <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.2-2.9 7.7-7 9-4.1-1.3-7-4.8-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span>
    <div>
      <p class="eyebrow">University helpdesk</p>
      <h1>Campus Complaint System</h1>
      <p class="tagline">Report hostel, academic and campus issues in one place and follow them until they are resolved.</p>
    </div>
    <p class="brand-foot">Students raise complaints &middot; Admins review and resolve them.</p>
  </aside>

  <main class="auth-main">
    <div class="auth-brand">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.2-2.9 7.7-7 9-4.1-1.3-7-4.8-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span>
      Campus Complaint System
    </div>

    <!-- Login -->
    <section class="card">
      <h2>Login</h2>
      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" placeholder="you@campus.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="login-pass">Password</label>
        <input id="login-pass" type="password" placeholder="Your password" autocomplete="current-password" />
      </div>
      <button id="login-btn" class="btn btn-primary btn-block">Login</button>
      <p id="login-msg" class="msg" role="status" aria-live="polite"></p>
    </section>

    <!-- Register -->
    <section class="card card-quiet">
      <h2>Register (student)</h2>
      <div class="field">
        <label for="reg-name">Name</label>
        <input id="reg-name" type="text" placeholder="Full name" autocomplete="name" />
      </div>
      <div class="field">
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" placeholder="you@campus.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="reg-pass">Password</label>
        <input id="reg-pass" type="password" placeholder="At least 6 characters" autocomplete="new-password" />
        <p class="hint">Minimum 6 characters.</p>
      </div>
      <button id="reg-btn" class="btn btn-secondary btn-block">Register</button>
      <p id="reg-msg" class="msg" role="status" aria-live="polite"></p>
    </section>
  </main>
</div>

<script src="app.js"></script>
<script>
  // already signed in? go straight to the right page
  const existing = getUser();
  if (localStorage.getItem(TOKEN_KEY) && existing) {
    location.href = existing.role === 'admin' ? 'admin.html' : 'student.html';
  }

  function goByRole(user, token) {
    saveSession(token, user);
    location.href = user.role === 'admin' ? 'admin.html' : 'student.html';
  }

  document.getElementById('login-btn').onclick = e => busy(e.currentTarget, async () => {
    const msg = document.getElementById('login-msg');
    try {
      const data = await api('/api/login', {
        method: 'POST',
        body: {
          email: document.getElementById('login-email').value.trim(),
          password: document.getElementById('login-pass').value
        }
      });
      goByRole(data.user, data.token);
    } catch (err) { showMsg(msg, err.message, true); }
  });

  document.getElementById('reg-btn').onclick = e => busy(e.currentTarget, async () => {
    const msg = document.getElementById('reg-msg');
    try {
      const data = await api('/api/register', {
        method: 'POST',
        body: {
          name: document.getElementById('reg-name').value.trim(),
          email: document.getElementById('reg-email').value.trim(),
          password: document.getElementById('reg-pass').value
        }
      });
      goByRole(data.user, data.token);
    } catch (err) { showMsg(msg, err.message, true); }
  });

  // allow Enter key to submit
  document.querySelectorAll('input').forEach(i =>
    i.addEventListener('keydown', e => { if (e.key === 'Enter') i.closest('.card').querySelector('button').click(); }));
</script>
</body>
</html>
